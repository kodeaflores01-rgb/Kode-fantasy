<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 PPR Draft Cheat Sheet</title>

<style>
:root {
    --bg: #070b10;
    --card: #101720;
    --card2: #151e28;
    --border: #293642;
    --text: #f5f7fa;
    --muted: #8d9aa8;
    --green: #54e59a;
    --red: #ff6666;
    --gold: #f5c451;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(7,11,16,.96);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--border);
}

.header {
    max-width: 850px;
    margin: auto;
    padding: 15px;
}

h1 {
    margin: 0;
    font-size: 23px;
}

.subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 12px 12px 70px;
}

/* BEST AVAILABLE */

.best {
    background: linear-gradient(135deg,#14251d,#101720);
    border: 1px solid #31533f;
    border-radius: 17px;
    padding: 17px;
    margin-bottom: 12px;
}

.best-label {
    color: var(--green);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .12em;
}

.best-name {
    font-size: 27px;
    font-weight: 900;
    margin-top: 5px;
}

.best-info {
    color: var(--muted);
    margin-top: 3px;
}

/* SEARCH */

.controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 10px;
    margin-bottom: 12px;
}

.search {
    width: 100%;
    padding: 13px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: #0a1017;
    color: white;
    font-size: 16px;
    outline: none;
}

.filters {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    margin-top: 9px;
    padding-bottom: 2px;
}

.filter {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: #0a1017;
    color: var(--muted);
    padding: 9px 14px;
    border-radius: 50px;
    font-weight: 800;
}

.filter.active {
    background: white;
    color: black;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    text-align: center;
}

.stat-number {
    font-size: 19px;
    font-weight: 900;
}

.stat-label {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
}

/* PLAYER LIST */

.list {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 15px;
    overflow: hidden;
}

.player {
    display: grid;
    grid-template-columns: 43px 1fr 45px 42px;
    align-items: center;
    gap: 7px;
    padding: 12px 10px;
    border-bottom: 1px solid #202a34;
    cursor: pointer;
    transition: background .12s, transform .12s;
}

.player:last-child {
    border-bottom: none;
}

.player:active {
    background: var(--card2);
    transform: scale(.985);
}

.rank {
    color: #71808e;
    font-weight: 900;
}

.player-name {
    font-size: 15px;
    font-weight: 800;
}

.player-meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 2px;
}

.position {
    text-align: center;
    font-size: 11px;
    font-weight: 900;
}

.tier {
    text-align: right;
    color: var(--muted);
    font-size: 10px;
}

/* POSITION COLORS */

.rb { color: #54e59a; }
.wr { color: #5eb5ff; }
.qb { color: #c084fc; }
.te { color: #f5c451; }
.k { color: #fb7185; }
.dst { color: #94a3b8; }

/* BOTTOM */

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

button {
    font: inherit;
    cursor: pointer;
}

.action {
    padding: 12px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--card);
    color: white;
    font-weight: 800;
}

.undo {
    color: var(--green);
}

.reset {
    color: var(--red);
}

/* EMPTY */

.empty {
    padding: 40px 15px;
    text-align: center;
    color: var(--muted);
}

.empty strong {
    display: block;
    color: white;
    font-size: 18px;
    margin-bottom: 5px;
}

/* TOAST */

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    z-index: 999;

    transform: translateX(-50%) translateY(100px);

    background: white;
    color: black;

    padding: 11px 18px;
    border-radius: 50px;

    font-size: 13px;
    font-weight: 800;

    transition: transform .25s;
}

.toast.show {
    transform: translateX(-50%) translateY(0);
}

@media(max-width:450px) {

    .player {
        grid-template-columns: 35px 1fr 40px 35px;
        padding: 12px 8px;
    }

    .player-name {
        font-size: 14px;
    }

    .best-name {
        font-size: 23px;
    }
}
</style>
</head>

/*
====================================================
DRAFT STATE
====================================================
*/

let drafted = JSON.parse(
    localStorage.getItem("fantasyDrafted") || "[]"
);

let history = [];

let selectedPosition = "ALL";


/*
====================================================
SAVE
====================================================
*/

function save() {

    localStorage.setItem(
        "fantasyDrafted",
        JSON.stringify(drafted)
    );

}


/*
====================================================
DRAFT PLAYER
====================================================
*/

function draftPlayer(rank) {

    if (drafted.includes(rank)) {
        return;
    }

    drafted.push(rank);

    history.push(rank);

    save();

    const player =
        players.find(p => p[2] === rank);

    showToast(
        "✓ " + player[0]
    );

    render();

}


/*
====================================================
UNDO
====================================================
*/

function undoLast() {

    if (!history.length) {

        showToast(
            "Nothing to undo"
        );

        return;
    }

    const rank =
        history.pop();

    drafted =
        drafted.filter(
            r => r !== rank
        );

    save();

    const player =
        players.find(p => p[2] === rank);

    showToast(
        "↩ " + player[0] + " added back"
    );

    render();

}


/*
====================================================
RESET
====================================================
*/

function resetDraft() {

    const answer =
        confirm(
            "Reset all drafted players?"
        );

    if (!answer) {
        return;
    }

    drafted = [];

    history = [];

    save();

    render();

    showToast(
        "Draft reset"
    );

}


/*
====================================================
RENDER
====================================================
*/

function render() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const available =
        players.filter(
            player =>
                !drafted.includes(
                    player[2]
                )
        );

    /*
    BEST AVAILABLE
    */

    const best =
        available[0];

    if (best) {

        document.getElementById(
            "bestName"
        ).textContent =
            best[0];

        document.getElementById(
            "bestInfo"
        ).textContent =
            `${best[1]} • Overall #${best[2]} • Tier ${best[3]}`;

        document.getElementById(
            "nextRank"
        ).textContent =
            best[2];

    } else {

        document.getElementById(
            "bestName"
        ).textContent =
            "Draft Complete";

        document.getElementById(
            "bestInfo"
        ).textContent =
            "";

        document.getElementById(
            "nextRank"
        ).textContent =
            "-";

    }


    /*
    STATS
    */

    document.getElementById(
        "availableCount"
    ).textContent =
        available.length;

    document.getElementById(
        "draftedCount"
    ).textContent =
        drafted.length;


    /*
    FILTER
    */

    const filtered =
        available.filter(
            player => {

                const name =
                    player[0]
                        .toLowerCase();

                const position =
                    player[1];

                const matchesSearch =
                    name.includes(search);

                const matchesPosition =
                    selectedPosition === "ALL" ||
                    position === selectedPosition;

                return (
                    matchesSearch &&
                    matchesPosition
                );

            }
        );


    /*
    EMPTY
    */

    if (!filtered.length) {

        document.getElementById(
            "playerList"
        ).innerHTML = `
            <div class="empty">
                <strong>No players found</strong>
                Try another search or position.
            </div>
        `;

        return;

    }


    /*
    PLAYER ROWS
    */

    document.getElementById(
        "playerList"
    ).innerHTML =

        filtered.map(
            player => {

                const name =
                    player[0];

                const position =
                    player[1];

                const rank =
                    player[2];

                const tier =
                    player[3];

                const cssPosition =
                    position.toLowerCase();

                return `

                <div
                    class="player"
                    onclick="draftPlayer(${rank})"
                >

                    <div class="rank">
                        ${rank}
                    </div>

                    <div>

                        <div class="player-name">
                            ${name}
                        </div>

                        <div class="player-meta">
                            Tap to remove
                        </div>

                    </div>

                    <div
                        class="position ${cssPosition}"
                    >
                        ${position}
                    </div>

                    <div class="tier">
                        T${tier}
                    </div>

                </div>

                `;

            }
        ).join("");

}

document
    .querySelectorAll(".filter")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".filter")
                    .forEach(
                        b =>
                            b.classList.remove(
                                "active"
                            )
                    );

                button.classList.add(
                    "active"
                );

                selectedPosition =
                    button.dataset.position;

                render();

            }
        );

    });

document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


/*
====================================================
TOAST
====================================================
*/

let toastTimer;

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1200
        );

}
